experience:
  - role: Postdoctoral Scholar Research Associate in Physics
    org: California Institute of Technology, Pasadena, CA
    start: 2023-09-01
    summary: |
      Advisor: Dr. Christina M. S. Cohen.  \
      **Parker Solar Probe — IS⊙IS/EPI-Hi team member** (2023–present) and **IMAP — HIT team member** (2025–present).  \
      Multi-spacecraft studies of solar energetic particle (SEP) events with PSP, Solar Orbiter, STEREO and ACE: composition variations, inverse-velocity-arrival (IVA) events, and radial dependence of SEPs; anomalous and galactic cosmic rays in the inner heliosphere; radiation hazards in cis-lunar space; machine learning for SEP prediction.
    button:
      text: Caltech page
      url: 'https://zigongxu.people.caltech.edu/'
      icon: hero/arrow-top-right-on-square
  - role: Research Associate & Project Manager — Chang'E-4/LND
    org: Kiel University, Germany
    start: 2018-09-01
    end: 2023-08-01
    summary: |
      Principal scientist for operations and data analysis of the Lunar Lander Neutron and Dosimetry experiment (project manager 2019–2023).  \
      Reported the first solar energetic particle event observed on the lunar far side; derived the first primary (GCR) and albedo proton spectra on the lunar surface during the solar minimum between cycles 24 and 25; calibrated LND data products with Geant4 simulations.
    button:
      text: LND at Kiel
      icon: hero/arrow-right-circle
      url: https://www.physik.uni-kiel.de/en/institutes/departments/extraterrestrial-physics/research/lunar-lander-neutrons-dosimetry-on-change-4
  - role: Research Associate — Solar Orbiter EPD/HET
    org: Kiel University, Germany
    start: 2020-09-01
    end: 2023-09-01
    summary: |
      Analysed Energetic Particle Detector data for large and widespread SEP events; measured the radial gradients of anomalous and galactic cosmic rays from 0.3 to 1 au with the High Energy Telescope; cross-calibrated HET with other instruments.
  - role: Research Assistant
    org: Nanjing University, China
    start: 2015-09-01
    end: 2018-06-30
    summary: |
      Coronal shock waves and SEP production using remote-sensing (SDO, STEREO, SOHO, RHESSI, GOES) and in-situ particle data (GOES, ACE, WIND). PI of a Jiangsu Province Postgraduate Research & Practice Innovation project (KYCX17_0023) on SEP sources and acceleration.

