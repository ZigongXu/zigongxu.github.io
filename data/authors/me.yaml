bio: |
  I study how the Sun accelerates particles to high energies and what those particles — together with galactic and anomalous cosmic rays — do to the radiation environment of the inner heliosphere and the Moon. I work hands-on with instrument data from NASA's Parker Solar Probe (IS⊙IS/EPI-Hi) and IMAP (HIT), ESA's Solar Orbiter (EPD/HET), and China's Chang'E-4 lander (LND), combining multi-spacecraft observations, Geant4 simulation, statistics and machine learning to understand solar energetic particle events and assess radiation risk for space exploration.

